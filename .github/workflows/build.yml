---
name: Build and Push OCI Image

on:
  push:
    branches:
      - main
      - refactor/homemade-script
  pull_request:
    branches:
      - main
      - refactor/homemade-script
    paths-ignore:
      - "**.md"
      - ".gitignore"
  # schedule:
  # Rebuild weekly (Saturday 03:00 UTC) so the base bluefin-dx layer stays fresh
  # - cron: "0 3 * * 6"
  workflow_dispatch:

env:
  IMAGE_NAME: caelestia-bluefin-katos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write # for Sigstore keyless signing

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Image metadata ───────────────────────────────────────────────────────
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/homemade-script' }}
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build OCI image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./Containerfile
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          # Allow network access for git clone / package downloads in build.sh
          extra-args: |
            --network=host

      # ── Smoke test ──────────────────────────────────────────────────────────
      - name: Verify image contents
        run: |
          podman run --rm ${{ steps.build.outputs.image-with-tag }} \
            sh -ec '
              rpm -q caelestia-shell caelestia-cli quickshell-git qt6-qtbase qt6-qtdeclarative
              command -v caelestia
              command -v hyprland
              command -v uwsm
              command -v hyprblue-caelestia-migrate
              test -f /etc/xdg/quickshell/caelestia/shell.qml
              test -f /usr/share/caelestia-dots/hypr/hyprland.lua
              hyprblue-caelestia-migrate --help >/dev/null
              qs --version
            '

      # ── Migration fixture test ──────────────────────────────────────────────
      - name: Verify legacy config migration
        run: |
          podman run --rm ${{ steps.build.outputs.image-with-tag }} sh -ec '
            export HOME=/tmp/testhome
            export XDG_CONFIG_HOME="$HOME/.config"
            export XDG_STATE_HOME="$HOME/.local/state"
            mkdir -p "$XDG_CONFIG_HOME/hypr/hyprland" "$XDG_CONFIG_HOME/caelestia"

            cat > "$XDG_CONFIG_HOME/hypr/variables.conf" <<"EOF"
          $terminal = foot
          $browser = flatpak run app.zen_browser.app
          $editor = code
          $fileExplorer = thunar
          $gituiclient = flatpak run com.axosoft.GitKraken
          $windowOpacity = 0.95
          $kbTerminal = Super, T
          EOF

            cat > "$XDG_CONFIG_HOME/hypr/hyprland/keybinds.conf" <<"EOF"
          bind = Super, G, exec, app2unit -- $gituiclient
          bind = Super, X, exec, notify-send custom-direct-bind
          EOF

            cat > "$XDG_CONFIG_HOME/caelestia/hypr-vars.conf" <<"EOF"
          $windowOpacity = 0.88
          EOF

            cat > "$XDG_CONFIG_HOME/caelestia/hypr-user.conf" <<"EOF"
          monitor = DP-1, 3840x2160@144, 0x0, 1
          exec-once = openrgb --startminimized
          bindn = Super, B, exec, notify-send non-consuming
          EOF

            cat > "$XDG_CONFIG_HOME/caelestia/shell.json" <<"EOF"
          {
            "appearance": {
              "font": {
                "family": {
                  "clock": "Rubik",
                  "material": "Material Symbols Rounded",
                  "mono": "CaskaydiaCove NF",
                  "sans": "Rubik"
                },
                "size": { "scale": 1, "title": 1.15 }
              },
              "transparency": {
                "enabled": true,
                "base": 0.72,
                "layers": 0.33
              }
            }
          }
          EOF

            hyprblue-caelestia-migrate
            hyprblue-caelestia-migrate --apply

            grep -F "browser = \"flatpak run app.zen_browser.app\"" "$XDG_CONFIG_HOME/caelestia/hypr-vars.lua"
            grep -F "editor = \"code\"" "$XDG_CONFIG_HOME/caelestia/hypr-vars.lua"
            grep -F "windowOpacity = 0.88" "$XDG_CONFIG_HOME/caelestia/hypr-vars.lua"
            grep -F "flatpak run com.axosoft.GitKraken" "$XDG_CONFIG_HOME/caelestia/hypr-user.lua"
            grep -F "hl.monitor" "$XDG_CONFIG_HOME/caelestia/hypr-user.lua"
            grep -F -- "-- TODO legacy: bindn = Super, B, exec, notify-send non-consuming" "$XDG_CONFIG_HOME/caelestia/hypr-user.lua"
            test -f "$XDG_CONFIG_HOME/hypr/hyprland.lua"

            report="$(find "$XDG_STATE_HOME/hyprblue-caelestia/backups" -name migration-report.txt -print -quit)"
            test -n "$report"
            grep -F "Legacy direct exec bind not automatically migrated: bind = Super, X, exec, notify-send custom-direct-bind" "$report"
            grep -F "Untranslated hypr-user.conf bind flags" "$report"
            grep -F "bindn = Super, B, exec, notify-send non-consuming" "$report"
            grep -F "\"title\": 1.15" "$report"

            python3 - <<"PY"
          import json, os
          from pathlib import Path
          p = Path(os.environ["XDG_CONFIG_HOME"]) / "caelestia/shell.json"
          data = json.loads(p.read_text())
          font = data["appearance"]["font"]
          tr = data["appearance"]["transparency"]
          assert "family" not in font
          assert "size" not in font
          assert font["scale"] == 1
          assert font["clock"] == "Rubik"
          assert font["headline"]["family"] == "Rubik"
          assert font["mono"]["family"] == "CaskaydiaCove NF"
          assert tr == {"enabled": True, "base": 0.72, "layers": 0.33}
          PY
          '

      # ── Push (main branch only) ─────────────────────────────────────────────
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      # ── Sigstore signing ─────────────────────────────────────────────────────
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with GitHub OIDC token (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          IMAGE_WITH_DIGEST="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          # GHCR requires lowercase — convert just in case
          IMAGE_WITH_DIGEST="${IMAGE_WITH_DIGEST,,}"
          echo "Signing ${IMAGE_WITH_DIGEST}"
          cosign sign --yes "${IMAGE_WITH_DIGEST}"